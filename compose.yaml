# Local development only. Separate Postgres instances enforce database isolation.
services:
  core-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: core
      POSTGRES_PASSWORD: local-core-password
      POSTGRES_DB: core
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["core-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U core -d core"]
      interval: 5s
      timeout: 5s
      retries: 10
  growth-db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: local-growth-password
      POSTGRES_DB: growth
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["growth-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growth"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  core-data:
  growth-data:
