name: Monorepo CI
on:
  push:
    branches: [main, 'refactor/**', 'feature/**', 'recovery/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: circle
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: events_circle_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U circle -d events_circle_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://circle:test-only-password@localhost:5432/events_circle_test
      TEST_DATABASE_URL: postgresql://circle:test-only-password@localhost:5432/events_circle_test
      CI: 'true'
      NEXT_TELEMETRY_DISABLED: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level low
      - run: node scripts/check-secrets.mjs
      - run: pnpm generate
      - run: pnpm --filter @events-circle/backend db:migrate
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify repaired audit against isolated PostgreSQL
        env:
          PGPASSWORD: test-only-password
          AUDIT_DATABASE_URL: postgresql://circle:test-only-password@localhost:5432/events_circle_audit_test
        run: |
          createdb --host=localhost --username=circle events_circle_audit_test
          DATABASE_URL="$AUDIT_DATABASE_URL" pnpm --filter @events-circle/backend db:migrate
          node backend/audits/core-verification.mjs
      - run: pnpm contracts
      - run: git diff --exit-code -- backend/openapi.json packages/api-client/src/openapi.d.ts
      - run: pnpm build
      - run: docker build -f infrastructure/docker/backend.Dockerfile -t events-circle-api:ci .
