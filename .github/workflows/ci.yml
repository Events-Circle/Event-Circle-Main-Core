name: Core verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      core-db:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: core
          POSTGRES_PASSWORD: ci-core-only
          POSTGRES_DB: core_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U core -d core_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      growth-db:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: growth
          POSTGRES_PASSWORD: ci-growth-only
          POSTGRES_DB: growth_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U growth -d growth_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CORE_DATABASE_URL: postgresql://core:ci-core-only@localhost:5432/core_test
      GROWTH_DATABASE_URL: postgresql://growth:ci-growth-only@localhost:5433/growth_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run migrate:core && npm run migrate:growth
      - run: npm run test:integration
      - run: docker build --target core -t events-circle-core:test .
      - run: docker build --target growth -t events-circle-growth:test .
